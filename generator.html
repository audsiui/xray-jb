<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xray 配置生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
        }
        .card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid #2a2a4e;
        }
        .card-title {
            color: #00d4ff;
            font-size: 1.2em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .mode-option {
            position: relative;
        }
        .mode-option input {
            position: absolute;
            opacity: 0;
        }
        .mode-label {
            display: block;
            padding: 20px;
            background: #252545;
            border: 2px solid #353565;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .mode-option input:checked + .mode-label {
            border-color: #00d4ff;
            background: #1a3a5c;
        }
        .mode-label:hover {
            border-color: #00a0cc;
        }
        .mode-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .mode-name {
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .mode-desc {
            font-size: 0.85em;
            color: #888;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #252545;
            border: 1px solid #353565;
            border-radius: 8px;
            color: #fff;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .hidden {
            display: none;
        }
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }
        .generate-btn:active {
            transform: translateY(0);
        }
        .result-card {
            background: #0d1b2a;
            border: 1px solid #1b3a4b;
            margin-top: 20px;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .result-title {
            color: #00d4ff;
            font-size: 1.1em;
        }
        .copy-btn {
            padding: 8px 20px;
            background: #2a2a4e;
            border: 1px solid #3a3a6e;
            border-radius: 6px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #00d4ff;
            color: #0f0f23;
        }
        .command-box {
            background: #000;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: #00ff88;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }
        .info-box {
            background: #1a3a3a;
            border-left: 4px solid #00d4ff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
        }
        .info-box p {
            margin: 0;
            color: #ccc;
            font-size: 0.9em;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .checkbox-group label {
            cursor: pointer;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Xray 配置生成器</h1>
        <p class="subtitle">选择协议类型，一键生成安装命令</p>

        <div class="card">
            <div class="card-title">
                <span>📡</span> 选择协议类型
            </div>
            <div class="mode-grid">
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-direct" value="direct" checked>
                    <label for="mode-direct" class="mode-label">
                        <div class="mode-icon">🌐</div>
                        <div class="mode-name">VLESS + WS</div>
                        <div class="mode-desc">WebSocket 直连模式</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-xhttp" value="xhttp">
                    <label for="mode-xhttp" class="mode-label">
                        <div class="mode-icon">⚡</div>
                        <div class="mode-name">VLESS + XHTTP</div>
                        <div class="mode-desc">XHTTP 传输协议</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-reality" value="reality">
                    <label for="mode-reality" class="mode-label">
                        <div class="mode-icon">🔒</div>
                        <div class="mode-name">VLESS + REALITY</div>
                        <div class="mode-desc">REALITY 伪装直连</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-tunnel" value="tunnel">
                    <label for="mode-tunnel" class="mode-label">
                        <div class="mode-icon">☁️</div>
                        <div class="mode-name">VLESS + CF Tunnel</div>
                        <div class="mode-desc">Cloudflare 隧道穿透</div>
                    </label>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span>⚙️</span> 配置参数
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>端口号</label>
                    <input type="number" id="port" placeholder="默认: 8080" min="1" max="65535">
                </div>
            </div>

            <div id="tunnel-fields" class="hidden">
                <div class="form-row">
                    <div class="form-group">
                        <label>域名 (DOMAIN)</label>
                        <input type="text" id="domain" placeholder="例如: v.example.com">
                    </div>
                    <div class="form-group">
                        <label>优选域名 (可选)</label>
                        <input type="text" id="opt-domain" placeholder="默认: cf.tencentapp.cn">
                    </div>
                </div>
                <div class="form-group">
                    <label>Cloudflare Token</label>
                    <input type="text" id="token" placeholder="输入你的 Cloudflare Tunnel Token">
                </div>
            </div>

            <div id="reality-fields" class="hidden">
                <div class="form-group">
                    <label>伪装域名 (SNI)</label>
                    <input type="text" id="sni" placeholder="默认: www.microsoft.com" value="www.microsoft.com">
                </div>
            </div>
        </div>

        <button class="generate-btn" onclick="generateCommand()">
            生成安装命令
        </button>

        <div id="result" class="card result-card hidden">
            <div class="result-header">
                <span class="result-title">📋 安装命令</span>
                <button class="copy-btn" onclick="copyCommand()">复制</button>
            </div>
            <div class="command-box" id="command"></div>
            <div class="info-box">
                <p>💡 将上方命令复制粘贴到服务器终端执行即可安装</p>
            </div>
        </div>
    </div>

    <script>
        // 监听模式切换
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const mode = this.value;
                document.getElementById('tunnel-fields').classList.toggle('hidden', mode !== 'tunnel');
                document.getElementById('reality-fields').classList.toggle('hidden', mode !== 'reality');
                
                // 设置默认端口
                const portInput = document.getElementById('port');
                if (mode === 'direct') portInput.placeholder = '默认: 8080';
                else if (mode === 'xhttp') portInput.placeholder = '默认: 8081';
                else if (mode === 'reality') portInput.placeholder = '默认: 8443';
                else if (mode === 'tunnel') portInput.placeholder = '默认: 10086';
            });
        });

        function generateCommand() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const port = document.getElementById('port').value;
            
            let command = 'bash <(curl -sL https://raw.githubusercontent.com/audsiui/xray-jb/main/main.sh)';
            command += ` --mode ${mode}`;
            
            // 添加端口
            const defaultPorts = {
                'direct': '8080',
                'xhttp': '8081',
                'reality': '8443',
                'tunnel': '10086'
            };
            if (port && port !== defaultPorts[mode]) {
                command += ` --port ${port}`;
            }
            
            // 根据不同模式添加参数
            if (mode === 'tunnel') {
                const domain = document.getElementById('domain').value.trim();
                const token = document.getElementById('token').value.trim();
                const optDomain = document.getElementById('opt-domain').value.trim();
                
                if (!domain || !token) {
                    alert('隧道模式需要填写域名和 Token');
                    return;
                }
                
                command += ` --domain ${domain}`;
                command += ` --token ${token}`;
                if (optDomain) {
                    command += ` --opt-domain ${optDomain}`;
                }
            } else if (mode === 'reality') {
                const sni = document.getElementById('sni').value.trim();
                if (sni && sni !== 'www.microsoft.com') {
                    command += ` --domain ${sni}`;
                }
            }
            
            // 显示结果
            document.getElementById('command').textContent = command;
            document.getElementById('result').classList.remove('hidden');
            
            // 滚动到结果
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }

        function copyCommand() {
            const command = document.getElementById('command').textContent;
            navigator.clipboard.writeText(command).then(() => {
                const btn = document.querySelector('.copy-btn');
                const originalText = btn.textContent;
                btn.textContent = '已复制!';
                btn.style.background = '#00ff88';
                btn.style.color = '#000';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(() => {
                // 降级方案
                const range = document.createRange();
                range.selectNode(document.getElementById('command'));
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                alert('命令已复制到剪贴板');
            });
        }
    </script>
</body>
</html>
