<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xray Configuration</title>
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: rgba(28, 28, 30, 0.6);
            --surface-active: rgba(44, 44, 46, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #0A84FF;
            --accent-gradient: linear-gradient(135deg, #0A84FF, #5E5CE6);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --glass-blur: blur(20px);
            --radius-l: 24px;
            --radius-m: 16px;
            --radius-s: 12px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            /* 模拟高级的弥散光背景 */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(10, 132, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(94, 92, 230, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 680px;
            animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 头部设计 */
        header {
            text-align: center;
            margin-bottom: 48px;
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 17px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* iOS 风格的分组容器 */
        .group-container {
            background: var(--surface-color);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-l);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .group-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding-left: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 协议选择 Grid */
        .mode-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .mode-option {
            position: relative;
        }

        .mode-option input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .mode-label {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-m);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            height: 100%;
        }

        .mode-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 12px;
            color: var(--text-secondary);
            transition: color 0.3s;
        }
        
        .mode-icon svg {
            width: 100%;
            height: 100%;
        }

        .mode-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .mode-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* 选中状态 */
        .mode-option input:checked + .mode-label {
            background: rgba(10, 132, 255, 0.15);
            border-color: rgba(10, 132, 255, 0.4);
        }

        .mode-option input:checked + .mode-label .mode-icon {
            color: var(--accent-color);
        }

        .mode-label:active {
            transform: scale(0.98);
        }

        /* 表单输入区域 - 类似 iOS 设置列表 */
        .input-list {
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-s);
            overflow: hidden;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
            position: relative;
            padding: 0 16px;
            height: 56px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.3s;
        }

        .form-group:last-child {
            border-bottom: none;
        }

        .form-group:focus-within {
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group label {
            font-size: 15px;
            color: var(--text-primary);
            width: 120px;
            flex-shrink: 0;
        }

        .form-group input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--accent-color);
            font-size: 16px;
            text-align: right;
            outline: none;
            font-family: var(--font-stack);
        }

        .form-group input::placeholder {
            color: rgba(235, 235, 245, 0.3);
        }

        .hidden {
            display: none;
        }

        /* 按钮设计 */
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent-gradient);
            border: none;
            border-radius: var(--radius-l);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .generate-btn:hover {
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.4);
            transform: translateY(-1px);
        }

        .generate-btn:active {
            transform: scale(0.98);
        }

        /* 结果区域 */
        .result-card {
            margin-top: 32px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .result-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .command-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-s);
            padding: 16px;
            font-family: "Menlo", "Monaco", monospace;
            font-size: 13px;
            color: #A8E6CF;
            line-height: 1.6;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .info-text {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SVG 图标定义 */
        .icon {
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Xray 配置生成器</h1>
            <p class="subtitle">Designed for Performance</p>
        </header>

        <div class="group-container">
            <div class="group-title">协议类型 / PROTOCOL</div>
            <div class="mode-grid">
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-direct" value="direct" checked>
                    <label for="mode-direct" class="mode-label">
                        <div class="mode-icon">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                        </div>
                        <div class="mode-name">VLESS + WS</div>
                        <div class="mode-desc">标准直连模式</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-xhttp" value="xhttp">
                    <label for="mode-xhttp" class="mode-label">
                        <div class="mode-icon">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                        </div>
                        <div class="mode-name">XHTTP</div>
                        <div class="mode-desc">下一代传输协议</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-reality" value="reality">
                    <label for="mode-reality" class="mode-label">
                        <div class="mode-icon">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                        <div class="mode-name">REALITY</div>
                        <div class="mode-desc">无损伪装技术</div>
                    </label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" id="mode-tunnel" value="tunnel">
                    <label for="mode-tunnel" class="mode-label">
                        <div class="mode-icon">
                            <svg viewBox="0 0 24 24" class="icon"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
                        </div>
                        <div class="mode-name">CF Tunnel</div>
                        <div class="mode-desc">Cloudflare 隧道</div>
                    </label>
                </div>
            </div>
        </div>

        <div class="group-container">
            <div class="group-title">详细配置 / CONFIGURATION</div>
            
            <div class="input-list">
                <div class="form-group">
                    <label>服务端口</label>
                    <input type="number" id="port" placeholder="Default: 8080" min="1" max="65535">
                </div>

                <div id="tunnel-fields" class="hidden">
                    <div class="form-group">
                        <label>绑定域名</label>
                        <input type="text" id="domain" placeholder="v.example.com">
                    </div>
                    <div class="form-group">
                        <label>优选地址</label>
                        <input type="text" id="opt-domain" placeholder="Optional">
                    </div>
                    <div class="form-group">
                        <label>CF Token</label>
                        <input type="text" id="token" placeholder="Tunnel Token Key">
                    </div>
                </div>

                <div id="reality-fields" class="hidden">
                    <div class="form-group">
                        <label>SNI 伪装</label>
                        <input type="text" id="sni" placeholder="www.microsoft.com" value="www.microsoft.com">
                    </div>
                </div>
            </div>
        </div>

        <button class="generate-btn" onclick="generateCommand()">
            生成安装指令
        </button>

        <div id="result" class="group-container result-card hidden">
            <div id="bash-section">
                <div class="result-header">
                    <span class="result-title">
                        <svg viewBox="0 0 24 24" class="icon" style="width:18px;height:18px;margin-right:6px;"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                        Terminal Command
                    </span>
                    <button class="copy-btn" onclick="copyCommand('command', this)">Copy</button>
                </div>
                <div class="command-box" id="command"></div>
            </div>
            <div id="docker-section" class="hidden" style="margin-top: 20px;">
                <div class="result-header">
                    <span class="result-title">
                        <svg viewBox="0 0 24 24" class="icon" style="width:18px;height:18px;margin-right:6px;"><path d="M4 10h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10z"/><path d="M8 10V7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v3"/></svg>
                        Docker Command
                    </span>
                    <button class="copy-btn" onclick="copyCommand('docker-command', this)">Copy</button>
                </div>
                <div class="command-box" id="docker-command"></div>
            </div>
            <p class="info-text">在服务器终端粘贴并运行上述命令</p>
        </div>
    </div>

    <script>
        // 监听模式切换
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const mode = this.value;
                
                // 简单的显隐逻辑
                document.getElementById('tunnel-fields').classList.toggle('hidden', mode !== 'tunnel');
                document.getElementById('reality-fields').classList.toggle('hidden', mode !== 'reality');
                
                // 设置默认端口占位符
                const portInput = document.getElementById('port');
                const placeholders = {
                    'direct': 'Default: 8080',
                    'xhttp': 'Default: 8081',
                    'reality': 'Default: 8443',
                    'tunnel': 'Default: 10086'
                };
                portInput.placeholder = placeholders[mode];
            });
        });

        function generateCommand() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const port = document.getElementById('port').value;
            
            let command = 'bash <(curl -sL https://raw.githubusercontent.com/audsiui/xray-jb/main/main.sh)';
            command += ` --mode ${mode}`;
            
            // 端口映射表
            const defaultPorts = {
                'direct': '8080',
                'xhttp': '8081',
                'reality': '8443',
                'tunnel': '10086'
            };
            if (port && port !== defaultPorts[mode]) {
                command += ` --port ${port}`;
            }
            
            // 模式特有参数
            let dockerCommand = '';
            if (mode === 'tunnel') {
                const domain = document.getElementById('domain').value.trim();
                const token = document.getElementById('token').value.trim();
                const optDomain = document.getElementById('opt-domain').value.trim();
                
                if (!domain || !token) {
                    // 使用原生 alert 保持简单，实际项目中可以用 Toast
                    alert('请填写 Cloudflare 域名和 Token');
                    return;
                }
                
                command += ` --domain ${domain}`;
                command += ` --token ${token}`;
                if (optDomain) {
                    command += ` --opt-domain ${optDomain}`;
                }
                
                // 生成 Docker 命令
                const actualPort = port || defaultPorts[mode];
                dockerCommand = `docker run -d \\\n  --name xray-tunnel \\\n  --restart always \\\n  -p ${actualPort}:${actualPort} \\\n  -e TUNNEL_TOKEN=${token} \\\n  -e DOMAIN=${domain} \\\n  -e PORT=${actualPort} \\\n  -e OPT_DOMAIN=${optDomain || ''} \\\n  ghcr.io/audsiui/xray-jb:latest`;
            } else if (mode === 'reality') {
                const sni = document.getElementById('sni').value.trim();
                if (sni && sni !== 'www.microsoft.com') {
                    command += ` --domain ${sni}`;
                }
            }
            
            // 渲染结果
            const resultBox = document.getElementById('result');
            const commandBox = document.getElementById('command');
            const dockerSection = document.getElementById('docker-section');
            const dockerCommandBox = document.getElementById('docker-command');
            
            commandBox.textContent = command;
            resultBox.classList.remove('hidden');
            
            // 显示或隐藏 Docker 命令区域
            if (dockerCommand) {
                dockerCommandBox.textContent = dockerCommand;
                dockerSection.classList.remove('hidden');
            } else {
                dockerSection.classList.add('hidden');
            }
            
            // 平滑滚动
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function copyCommand(elementId, btn) {
            const command = document.getElementById(elementId).textContent;
            
            navigator.clipboard.writeText(command).then(() => {
                const originalText = btn.textContent;
                btn.textContent = 'Copied';
                btn.style.background = '#30D158'; // iOS Green
                btn.style.color = '#FFFFFF';
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(() => {
                alert('复制失败，请手动选择复制');
            });
        }
    </script>
</body>
</html>
